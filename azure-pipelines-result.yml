# Docker
# Build and push an image to Azure Container Registry
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
 paths:
   include:
     - result/*

resources:
- repo: self

variables:
  # Container registry service connection established during pipeline creation
  dockerRegistryServiceConnection: 'c97543fa-2456-4660-b63c-d01b061f721a'
  imageRepository: 'resultapp'
  containerRegistry: 'jainazurecicd.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/result/Dockerfile'
  tag: '$(Build.BuildId)'

pool:
 name: 'Default'

stages:
- stage: Build
  displayName: Build
  jobs:
  - job: Build
    displayName: Build    
    steps:
    - task: Docker@2
      displayName: Build an image to container registry
      inputs:
        command: 'build'
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)

- stage: Push
  displayName: Push
  jobs:
  - job: Push
    displayName: Push    
    steps:
    - task: Docker@2
      displayName: Push an image to the container registry
      inputs:
        command: 'push'
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)