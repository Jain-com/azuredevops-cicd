# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
 paths:
  include:
    - result/*

resources:
- repo: self

variables:
  dockerRegistryServiceConnection: 'ACR-External'  # Replace with your actual service connection name
  imageRepository: 'resultapp'
  containerRegistry: 'jainazurecicd.azurecr.io'    # Fixed typo: 'ainazurecicd' → 'jainazurecicd'
  dockerfilePath: '$(Build.SourcesDirectory)/result/Dockerfile'  # Removed extra single quote
  tag: '$(Build.BuildId)'


pool:
  vmImage: ubuntu-latest

stages:
- stage: Build
  displayName: Build 
  jobs:
  - job: Build
    displayName: Build
    steps:
    - task: Docker@2
      displayName: Build image
      inputs:
        containerRegistry: '$(dockerRegistryServiceConnection)'
        repository: '$(imageRepository)'
        command: 'build'
        Dockerfile: 'result/Dockerfile'
        tags: '$(tag)'

- stage: Push
  displayName: Push 
  jobs:
  - job: Build
    displayName: Push
    steps:
    - task: Docker@2
      displayName: push image
      inputs:
        containerRegistry: '$(dockerRegistryServiceConnection)'
        repository: '$(imageRepository)'
        command: 'push'
        tags: '$(tag)'
