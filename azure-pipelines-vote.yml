# Docker
# Build and push an image to Azure Container Registry
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
 paths:
   include:
     - vote/*
 

resources:
- repo: self

variables:
  # Container registry service connection established during pipeline creation
  dockerRegistryServiceConnection: '20a94a50-fede-4f5e-bfbe-e8aac48feb8d'
  imageRepository: 'votingapp'
  containerRegistry: 'jainazurecicd.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/vote/Dockerfile'
  tag: '$(Build.BuildId)'

pool:
 name: 'Default'

stages:
- stage: Build
  displayName: Build 
  jobs:
  - job: Build
    displayName: Build
    
    steps:
    - task: Docker@2
      displayName: Build image
      inputs:
        containerRegistry: '$(dockerRegistryServiceConnection)'
        repository: '$(imageRepository)'
        command: 'build'
        Dockerfile: 'vote/Dockerfile'
        tags: '$(tag)'

- stage: Push
  displayName: Push the image 
  jobs:
  - job: Push
    displayName: Push
    
    steps:
    - task: Docker@2
      displayName: Push image
      inputs:
        containerRegistry: '$(dockerRegistryServiceConnection)'
        repository: '$(imageRepository)'
        command: 'push'        
        tags: '$(tag)'

- stage: update
  displayName: update
  jobs:
  - job: Update
    displayName: Update
    steps:
      - task: Bash@3
        displayName: 'Sanitize script line endings'
        inputs:
          targetType: 'inline'
          script: |
           sed -i -e 's/\r$//' scripts/updateK8Manifest.sh
           chmod +x scripts/updateK8Manifest.sh

      - task: ShellScript@2
        inputs:
         scriptPath: 'scripts/updateK8Manifest.sh'
         args: 'vote $(imageRepository) $(tag)'




